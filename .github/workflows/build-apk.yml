name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Analyze, Test, Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Resolve release metadata
        id: meta
        run: |
          APP_VER=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/' | tr -d '\r')
          echo "version=${APP_VER:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Prepare named APK asset
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/boardgame-calc.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardgame-calc-release-apk
          path: build/app/outputs/flutter-apk/boardgame-calc.apk
          retention-days: 30

      - name: Publish GitHub Release on main
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}.${{ github.run_number }}
          name: 보드게임 계산기 v${{ steps.meta.outputs.version }} (Build #${{ github.run_number }})
          generate_release_notes: true
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/boardgame-calc.apk
